kind = "web"
previewPath = "/"
title = "Treavue"
description = "A personalized travel planner for exploring destinations, building day-by-day itineraries, tracking budgets, and saving trips."
version = "1.0.0"
id = "artifacts/treavue"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20675

[services.development]
run = "pnpm --filter @workspace/treavue run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/treavue", "run", "build" ]
serve = "static"
publicDir = "artifacts/treavue/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20675"
BASE_PATH = "/"
